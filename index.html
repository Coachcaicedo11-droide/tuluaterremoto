<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitios de Tuluá</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .nav {
            display: flex;
            gap: 0;
            background: white;
            border-bottom: 1px solid #f0f0f0;
        }

        .nav-btn {
            flex: 1;
            padding: 16px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-btn:hover {
            color: #667eea;
            background: #f9f9f9;
        }

        .nav-btn.active {
            color: #667eea;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .main {
            padding: 25px;
            min-height: 500px;
        }

        .view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .view.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stat-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-num {
            font-size: 48px;
            font-weight: 700;
        }

        .item {
            background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%);
            border: 1px solid #e8e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .item-title {
            color: #667eea;
            font-size: 18px;
            font-weight: 700;
        }

        .item-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 10px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .btn-small:hover {
            background: #667eea;
            color: white;
        }

        .btn-delete:hover {
            background: #ff4757;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .item-row:last-child {
            margin-bottom: 0;
        }

        .item-icon {
            font-size: 16px;
            width: 20px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e8e8f0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }

        .checkbox-item input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #fafbfc;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .check-group {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .check-item label {
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 50px 20px;
            font-size: 14px;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .success {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #2d5016;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(132, 250, 176, 0.3);
        }

        .info-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #fff 100%);
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        h2 {
            color: #667eea;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #667eea;
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>📍 Sitios de Tuluá</h1>
            <p>Mapeo colaborativo de necesidades locales</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" data-view="dashboard">📊 Dashboard</button>
            <button class="nav-btn" data-view="explore">🗺️ Explorar</button>
            <button class="nav-btn" data-view="add">➕ Agregar</button>
        </div>

        <div class="main">
            <!-- Dashboard -->
            <div id="dashboard" class="view visible">
                <div class="stat-container">
                    <div class="stat-label">Zonas Registradas</div>
                    <div class="stat-num" id="total-zones">0</div>
                </div>
                <div id="dashboard-items"></div>
            </div>

            <!-- Explorar -->
            <div id="explore" class="view">
                <div id="explore-items"></div>
            </div>

            <!-- Agregar -->
            <div id="add" class="view">
                <h2>Agregar Nueva Zona</h2>
                <div id="message"></div>
                <div class="form-group">
                    <label class="form-label">Nombre de la zona *</label>
                    <input type="text" id="zone-name" placeholder="Ej: La Esperanza, Guachicono..." required>
                </div>
                <div class="form-group">
                    <label class="form-label">Responsable</label>
                    <input type="text" id="zone-owner" placeholder="Nombre de la persona encargada">
                </div>
                <div class="form-group">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" id="zone-phone" placeholder="+57 3XX XXX XXXX">
                </div>
                <div class="form-group">
                    <label class="form-label">Horario de Atención</label>
                    <input type="text" id="zone-schedule" placeholder="Lunes a Viernes 8am - 5pm">
                </div>
                <div class="form-group">
                    <label class="form-label">Observaciones</label>
                    <textarea id="zone-notes" placeholder="Información adicional sobre la zona..." style="resize: vertical; min-height: 80px;"></textarea>
                </div>
                <div class="check-group">
                    <div class="check-item">
                        <input type="checkbox" id="zone-needs-help">
                        <label for="zone-needs-help">Necesita ayuda 🆘</label>
                    </div>
                    <div class="check-item">
                        <input type="checkbox" id="zone-provides-help">
                        <label for="zone-provides-help">Recibe ayudas ✓</label>
                    </div>
                </div>
                <button class="btn-submit" id="submit-btn">✓ Agregar Zona</button>
                <div class="info-box">
                    <strong>💾 Datos en la nube</strong><br>
                    Los datos se guardan automáticamente en Supabase. Accesible desde cualquier dispositivo.
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Zona</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">Nombre</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label class="form-label">Responsable</label>
                <input type="text" id="edit-owner">
            </div>
            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="tel" id="edit-phone">
            </div>
            <div class="form-group">
                <label class="form-label">Horario</label>
                <input type="text" id="edit-schedule">
            </div>
            <div class="form-group">
                <label class="form-label">Observaciones</label>
                <textarea id="edit-notes" style="resize: vertical; min-height: 80px;"></textarea>
            </div>
            <div class="check-group">
                <div class="check-item">
                    <input type="checkbox" id="edit-needs-help">
                    <label for="edit-needs-help">Necesita ayuda 🆘</label>
                </div>
                <div class="check-item">
                    <input type="checkbox" id="edit-provides-help">
                    <label for="edit-provides-help">Recibe ayudas ✓</label>
                </div>
            </div>
            <button class="btn-submit" id="save-btn" onclick="saveEdit()">💾 Guardar</button>
            <button class="btn-submit" style="background: #ff4757; margin-top: 10px;" onclick="deleteZone()">🗑️ Eliminar</button>
        </div>
    </div>

    <script>
        const sbClient = window.supabase.createClient('https://mtumymoaqissgfmsfzcp.supabase.co', 'sb_publishable_sBL7cX_IVxzFdXeGxZQGDw_W9oGlUkC');
        let allZones = [];
        let editingZoneId = null;

        async function fetchZones() {
            try {
                const { data } = await sbClient.from('zones').select('*').order('created_at', { ascending: false });
                allZones = data || [];
                updateDashboard();
                updateExplore();
                document.getElementById('total-zones').textContent = allZones.length;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderZone(z) {
            const needsHelp = z.needs_help ? '🆘 Necesita ayuda' : '';
            const receivesHelp = z.provides_help ? '✓ Recibe ayudas' : '';
            const statusBadge = needsHelp || receivesHelp ? `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e8e8f0; font-size: 12px; color: #667eea; font-weight: 600;">${needsHelp} ${receivesHelp}</div>` : '';
            
            return `
                <div class="item">
                    <div class="item-header">
                        <div class="item-title">📍 ${z.name}</div>
                        <div class="item-buttons">
                            <button class="btn-small" onclick="openEditModal(${z.id})">✏️ Editar</button>
                            <button class="btn-small btn-delete" onclick="confirmDelete(${z.id})">🗑️</button>
                        </div>
                    </div>
                    <div class="item-row">
                        <div class="item-icon">👤</div>
                        <div>${z.owner || 'Sin asignar'}</div>
                    </div>
                    <div class="item-row">
                        <div class="item-icon">📞</div>
                        <div>${z.phone || 'Sin teléfono'}</div>
                    </div>
                    <div class="item-row">
                        <div class="item-icon">🕐</div>
                        <div>${z.schedule || 'Por definir'}</div>
                    </div>
                    ${z.notes ? `<div class="item-row"><div class="item-icon">📝</div><div>${z.notes}</div></div>` : ''}
                    ${statusBadge}
                </div>
            `;
        }

        function updateDashboard() {
            const container = document.getElementById('dashboard-items');
            if (allZones.length === 0) {
                container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Sin zonas registradas aún</div>';
                return;
            }
            container.innerHTML = allZones.map(z => renderZone(z)).join('');
        }

        function updateExplore() {
            const container = document.getElementById('explore-items');
            if (allZones.length === 0) {
                container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>Sin zonas registradas aún</div>';
                return;
            }
            container.innerHTML = allZones.map(z => renderZone(z)).join('');
        }

        function openEditModal(zoneId) {
            editingZoneId = zoneId;
            const zone = allZones.find(z => z.id === zoneId);
            document.getElementById('edit-name').value = zone.name;
            document.getElementById('edit-owner').value = zone.owner || '';
            document.getElementById('edit-phone').value = zone.phone || '';
            document.getElementById('edit-schedule').value = zone.schedule || '';
            document.getElementById('edit-notes').value = zone.notes || '';
            document.getElementById('edit-needs-help').checked = zone.needs_help || false;
            document.getElementById('edit-provides-help').checked = zone.provides_help || false;
            document.getElementById('editModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('show');
            editingZoneId = null;
        }

        async function saveEdit() {
            try {
                const { error } = await sbClient.from('zones').update({
                    name: document.getElementById('edit-name').value,
                    owner: document.getElementById('edit-owner').value || null,
                    phone: document.getElementById('edit-phone').value || null,
                    schedule: document.getElementById('edit-schedule').value || null,
                    notes: document.getElementById('edit-notes').value || null,
                    needs_help: document.getElementById('edit-needs-help').checked,
                    provides_help: document.getElementById('edit-provides-help').checked
                }).eq('id', editingZoneId);

                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }

                closeModal();
                fetchZones();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteZone() {
            if (!confirm('¿Estás seguro de que quieres eliminar esta zona?')) return;

            try {
                const { error } = await sbClient.from('zones').delete().eq('id', editingZoneId);
                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }
                closeModal();
                fetchZones();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function confirmDelete(zoneId) {
            editingZoneId = zoneId;
            deleteZone();
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const name = document.getElementById('zone-name').value.trim();
            if (!name) {
                alert('Por favor ingresa el nombre de la zona');
                return;
            }

            try {
                const { error } = await sbClient.from('zones').insert([{
                    name,
                    owner: document.getElementById('zone-owner').value.trim() || null,
                    phone: document.getElementById('zone-phone').value.trim() || null,
                    schedule: document.getElementById('zone-schedule').value.trim() || null,
                    notes: document.getElementById('zone-notes').value.trim() || null,
                    needs_help: document.getElementById('zone-needs-help').checked,
                    provides_help: document.getElementById('zone-provides-help').checked,
                    status: 'pending'
                }]);

                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }

                document.getElementById('zone-name').value = '';
                document.getElementById('zone-owner').value = '';
                document.getElementById('zone-phone').value = '';
                document.getElementById('zone-schedule').value = '';
                document.getElementById('zone-notes').value = '';
                document.getElementById('zone-needs-help').checked = false;
                document.getElementById('zone-provides-help').checked = false;

                const msg = document.getElementById('message');
                msg.innerHTML = '<div class="success">✓ ¡Zona agregada correctamente!</div>';
                setTimeout(() => msg.innerHTML = '', 3000);

                fetchZones();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('visible'));
                this.classList.add('active');
                document.getElementById(this.getAttribute('data-view')).classList.add('visible');
            });
        });

        // Cerrar modal si hace click afuera
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        fetchZones();
        setInterval(fetchZones, 5000);
    </script>
</body>
</html>
