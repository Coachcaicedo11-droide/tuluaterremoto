<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Sitios de Tuluá</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
        .app { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .navbar { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; padding: 2rem 1.5rem; text-align: center; }
        .navbar h1 { font-size: 32px; font-weight: 700; margin-bottom: 0.5rem; }
        .navbar p { font-size: 14px; opacity: 0.95; }
        .tabs { display: flex; border-bottom: 2px solid #f0fdf4; }
        .tab { flex: 1; padding: 1rem; background: white; border: none; cursor: pointer; font-size: 12px; font-weight: 600; color: #9ca3af; border-bottom: 3px solid transparent; }
        .tab:hover { background: #f0fdf4; }
        .tab.active { color: #16a34a; border-bottom-color: #16a34a; background: #f0fdf4; }
        .content { padding: 1.5rem; }
        .section { display: none; }
        .section.show { display: block; }
        .stat-box { background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%); border: 2px solid #86efac; border-radius: 12px; padding: 1.5rem; text-align: center; margin-bottom: 1rem; }
        .stat-box h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; margin-bottom: 0.5rem; }
        .stat-box .num { font-size: 32px; font-weight: 700; color: #16a34a; }
        .card { background: linear-gradient(135deg, #f0fdf4 0%, #f7fee7 100%); border: 2px solid #dcfce7; border-radius: 12px; padding: 1.2rem; margin-bottom: 1rem; }
        .card h3 { color: #16a34a; font-size: 18px; font-weight: 700; margin-bottom: 0.5rem; }
        .card p { font-size: 13px; color: #6b7280; margin-bottom: 0.4rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-size: 14px; font-weight: 700; color: #16a34a; margin-bottom: 0.7rem; }
        input { width: 100%; padding: 0.9rem; border: 2px solid #dcfce7; border-radius: 10px; font-size: 14px; background: #f0fdf4; font-family: inherit; }
        input:focus { outline: none; border-color: #16a34a; background: white; }
        button { width: 100%; padding: 1rem; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; margin-bottom: 1rem; text-transform: uppercase; }
        button:hover { opacity: 0.9; }
        .success { background: #dcfce7; color: #166534; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; font-weight: 600; }
        .empty { text-align: center; color: #9ca3af; padding: 2rem; }
    </style>
</head>
<body>
    <div class="app">
        <header class="navbar">
            <h1>📍 Sitios de Tuluá</h1>
            <p>Juntos mapeamos las necesidades locales</p>
        </header>

        <nav class="tabs">
            <button class="tab active" id="tab-dash">📊 Dashboard</button>
            <button class="tab" id="tab-explore">🗺️ Explorar</button>
            <button class="tab" id="tab-add">➕ Agregar</button>
        </nav>

        <div class="content">
            <!-- Dashboard -->
            <div id="section-dash" class="section show">
                <div class="stat-box">
                    <h3>✓ Zonas</h3>
                    <div class="num" id="count-zones">0</div>
                </div>
                <div id="dash-content"></div>
            </div>

            <!-- Explorar -->
            <div id="section-explore" class="section">
                <div id="explore-content"></div>
            </div>

            <!-- Agregar -->
            <div id="section-add" class="section">
                <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 1rem; color: #16a34a;">Agregar zona</h2>
                <div id="success-msg"></div>
                <form id="form-add">
                    <div class="form-group">
                        <label class="form-label">¿Nombre de la zona?</label>
                        <input type="text" id="input-name" placeholder="Ej: La Esperanza" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Responsable</label>
                            <input type="text" id="input-owner" placeholder="Nombre...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" id="input-phone" placeholder="+57...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Horario</label>
                        <input type="text" id="input-schedule" placeholder="Lunes a Viernes 8am - 5pm">
                    </div>
                    <button type="submit">✓ Agregar zona</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mtumymoaqissgfmsfzcp.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_sBL7cX_IVxzFdXeGxZQGDw_W9oGlUkC';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let zones = [];

        // Cargar datos
        async function loadData() {
            try {
                const { data } = await supabase.from('zones').select('*');
                zones = data || [];
                updateUI();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Actualizar UI
        function updateUI() {
            document.getElementById('count-zones').textContent = zones.length;

            const dashHtml = zones.length === 0 
                ? '<div class="empty">🔍 Sin zonas registradas</div>'
                : zones.map(z => `
                    <div class="card">
                        <h3>📍 ${z.name}</h3>
                        <p>👤 ${z.owner || 'Sin asignar'}</p>
                        <p>📞 ${z.phone || 'Sin teléfono'}</p>
                        <p>🕐 ${z.schedule || 'Por definir'}</p>
                    </div>
                `).join('');
            document.getElementById('dash-content').innerHTML = dashHtml;

            const exploreHtml = zones.length === 0 
                ? '<div class="empty">🔍 Sin zonas registradas</div>'
                : zones.map(z => `
                    <div class="card">
                        <h3>📍 ${z.name}</h3>
                        <p>👤 ${z.owner || 'Sin asignar'}</p>
                        <p>📞 ${z.phone || 'Sin teléfono'}</p>
                        <p>🕐 ${z.schedule || 'Por definir'}</p>
                    </div>
                `).join('');
            document.getElementById('explore-content').innerHTML = exploreHtml;
        }

        // Agregar zona
        document.getElementById('form-add').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('input-name').value;
            const owner = document.getElementById('input-owner').value || null;
            const phone = document.getElementById('input-phone').value || null;
            const schedule = document.getElementById('input-schedule').value || null;

            try {
                const { error } = await supabase.from('zones').insert([{
                    name, owner, phone, schedule, status: 'pending'
                }]);

                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }

                document.getElementById('input-name').value = '';
                document.getElementById('input-owner').value = '';
                document.getElementById('input-phone').value = '';
                document.getElementById('input-schedule').value = '';

                const msg = document.getElementById('success-msg');
                msg.innerHTML = '<div class="success">✓ ¡Zona agregada!</div>';
                setTimeout(() => msg.innerHTML = '', 3000);

                await loadData();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Tabs
        document.getElementById('tab-dash').addEventListener('click', function() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
            document.getElementById('section-dash').classList.add('show');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });

        document.getElementById('tab-explore').addEventListener('click', function() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
            document.getElementById('section-explore').classList.add('show');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });

        document.getElementById('tab-add').addEventListener('click', function() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
            document.getElementById('section-add').classList.add('show');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });

        // Cargar al inicio
        loadData();
    </script>
</body>
</html>
