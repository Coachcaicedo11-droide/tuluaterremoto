<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitios Tuluá</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; margin: 0; background: #f0fdf4; }
        .app { max-width: 600px; margin: 0 auto; background: white; }
        .header { background: #16a34a; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 28px; }
        .header p { margin: 5px 0 0 0; font-size: 12px; }
        .nav { display: flex; border-bottom: 2px solid #ddd; }
        .nav button { flex: 1; padding: 12px; background: white; border: none; cursor: pointer; font-size: 12px; }
        .nav button.active { background: #f0fdf4; border-bottom: 3px solid #16a34a; }
        .main { padding: 20px; min-height: 400px; }
        .view { display: none; }
        .view.visible { display: block; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { background: #15803d; }
        .stat { background: #dcfce7; border: 2px solid #86efac; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .stat-label { color: #999; font-size: 12px; }
        .stat-num { font-size: 36px; color: #16a34a; font-weight: bold; }
        .item { background: #f0fdf4; border: 2px solid #dcfce7; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .item-title { margin: 0 0 8px 0; color: #16a34a; font-size: 16px; }
        .item-text { margin: 4px 0; font-size: 12px; color: #666; }
        .empty { text-align: center; color: #999; padding: 30px; }
        .success { background: #dcfce7; color: #166534; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>📍 Sitios de Tuluá</h1>
            <p>Mapeo de necesidades locales</p>
        </div>

        <div class="nav">
            <button class="nav-btn active" data-view="dashboard">📊 Dashboard</button>
            <button class="nav-btn" data-view="explore">🗺️ Explorar</button>
            <button class="nav-btn" data-view="add">➕ Agregar</button>
        </div>

        <div class="main">
            <div id="dashboard" class="view visible">
                <div class="stat">
                    <div class="stat-label">Zonas</div>
                    <div class="stat-num" id="total-zones">0</div>
                </div>
                <div id="dashboard-items"></div>
            </div>

            <div id="explore" class="view">
                <div id="explore-items"></div>
            </div>

            <div id="add" class="view">
                <h2 style="color: #16a34a; font-size: 18px;">Agregar zona</h2>
                <div id="message"></div>
                <input type="text" id="zone-name" placeholder="Nombre de la zona" required>
                <input type="text" id="zone-owner" placeholder="Responsable">
                <input type="tel" id="zone-phone" placeholder="Teléfono">
                <input type="text" id="zone-schedule" placeholder="Horario">
                <button id="submit-btn">✓ Agregar</button>
            </div>
        </div>
    </div>

    <script>
        const sbClient = window.supabase.createClient('https://mtumymoaqissgfmsfzcp.supabase.co', 'sb_publishable_sBL7cX_IVxzFdXeGxZQGDw_W9oGlUkC');
        let allZones = [];

        async function fetchZones() {
            try {
                const { data } = await sbClient.from('zones').select('*');
                allZones = data || [];
                updateDashboard();
                updateExplore();
                document.getElementById('total-zones').textContent = allZones.length;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function updateDashboard() {
            const container = document.getElementById('dashboard-items');
            if (allZones.length === 0) {
                container.innerHTML = '<div class="empty">Sin zonas registradas</div>';
                return;
            }
            container.innerHTML = allZones.map(z => `
                <div class="item">
                    <h3 class="item-title">📍 ${z.name}</h3>
                    <p class="item-text">👤 ${z.owner || '-'}</p>
                    <p class="item-text">📞 ${z.phone || '-'}</p>
                    <p class="item-text">🕐 ${z.schedule || '-'}</p>
                </div>
            `).join('');
        }

        function updateExplore() {
            const container = document.getElementById('explore-items');
            if (allZones.length === 0) {
                container.innerHTML = '<div class="empty">Sin zonas registradas</div>';
                return;
            }
            container.innerHTML = allZones.map(z => `
                <div class="item">
                    <h3 class="item-title">📍 ${z.name}</h3>
                    <p class="item-text">👤 ${z.owner || '-'}</p>
                    <p class="item-text">📞 ${z.phone || '-'}</p>
                    <p class="item-text">🕐 ${z.schedule || '-'}</p>
                </div>
            `).join('');
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const name = document.getElementById('zone-name').value;
            if (!name) {
                alert('Nombre requerido');
                return;
            }

            try {
                const { error } = await sbClient.from('zones').insert([{
                    name,
                    owner: document.getElementById('zone-owner').value || null,
                    phone: document.getElementById('zone-phone').value || null,
                    schedule: document.getElementById('zone-schedule').value || null,
                    status: 'pending'
                }]);

                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }

                document.getElementById('zone-name').value = '';
                document.getElementById('zone-owner').value = '';
                document.getElementById('zone-phone').value = '';
                document.getElementById('zone-schedule').value = '';

                const msg = document.getElementById('message');
                msg.innerHTML = '<div class="success">✓ ¡Zona agregada!</div>';
                setTimeout(() => msg.innerHTML = '', 2000);

                fetchZones();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view').forEach(v => v.classList.remove('visible'));
                this.classList.add('active');
                document.getElementById(this.getAttribute('data-view')).classList.add('visible');
            });
        });

        fetchZones();
    </script>
</body>
</html>
